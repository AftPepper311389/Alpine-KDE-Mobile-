name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-alpine-rootfs:
    name: Build embedded Alpine ARM64 + KDE rootfs
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Alpine ARM64 + KDE Plasma root filesystem natively
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            alpine:3.24.4 sh scripts/build-alpine-rootfs.sh

      - name: Pack rootfs with parallel xz on the ARM64 host
        run: |
          mkdir -p .work/alpine-assets
          tar --numeric-owner -C .work/alpine-rootfs -I 'xz -T0 -6' \
            -cf .work/alpine-assets/alpine-rootfs-aarch64.tar.xz .
          sha256sum .work/alpine-assets/alpine-rootfs-aarch64.tar.xz \
            > .work/alpine-assets/alpine-rootfs-aarch64.tar.xz.sha256
          du -sh .work/alpine-rootfs .work/alpine-assets/alpine-rootfs-aarch64.tar.xz

      - name: Verify Alpine rootfs payload
        run: |
          test -s .work/alpine-assets/alpine-rootfs-aarch64.tar.xz
          sha256sum -c .work/alpine-assets/alpine-rootfs-aarch64.tar.xz.sha256
          grep -q '^KDE_DESKTOP=installed$' .work/alpine-assets/rootfs-build-info.txt
          grep -q '^P:plasma-desktop$' .work/alpine-assets/alpine-kde-package-check.txt
          grep -q '^P:plasma-workspace$' .work/alpine-assets/alpine-kde-package-check.txt
          grep -q '^P:kwin$' .work/alpine-assets/alpine-kde-package-check.txt
          grep -q '^P:gcompat$' .work/alpine-assets/alpine-kde-package-check.txt
          grep -q '^P:mesa-dri-gallium$' .work/alpine-assets/alpine-kde-package-check.txt
          grep -q '^P:mesa-egl$' .work/alpine-assets/alpine-kde-package-check.txt
          grep -q '^P:mesa-gbm$' .work/alpine-assets/alpine-kde-package-check.txt
          grep -q '^P:mesa-gl$' .work/alpine-assets/alpine-kde-package-check.txt
          grep -q '^P:mesa-gles$' .work/alpine-assets/alpine-kde-package-check.txt
          tar -tJf .work/alpine-assets/alpine-rootfs-aarch64.tar.xz > "$RUNNER_TEMP/rootfs-files.txt"
          grep -q './usr/bin/startplasma-wayland' "$RUNNER_TEMP/rootfs-files.txt"
          grep -q './usr/bin/kwin_wayland' "$RUNNER_TEMP/rootfs-files.txt"
          grep -q './usr/bin/dbus-run-session' "$RUNNER_TEMP/rootfs-files.txt"
          grep -q './usr/bin/Xwayland' "$RUNNER_TEMP/rootfs-files.txt"
          test -s .work/alpine-assets/ALPINE-LICENSES.txt

      - name: Upload generated Alpine rootfs payload
        uses: actions/upload-artifact@v4
        with:
          name: alpine-rootfs-payload
          path: .work/alpine-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-apk:
    name: Build single-APK Alpine KDE desktop
    needs: build-alpine-rootfs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download generated Alpine rootfs payload
        uses: actions/download-artifact@v4
        with:
          name: alpine-rootfs-payload
          path: .work/alpine-assets

      - name: Verify downloaded rootfs checksum
        run: |
          test -s .work/alpine-assets/alpine-rootfs-aarch64.tar.xz
          sha256sum -c .work/alpine-assets/alpine-rootfs-aarch64.tar.xz.sha256

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build meson pkg-config python3 python3-pip \
            autoconf automake libtool gettext flex bison git curl wget zip unzip \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libffi-dev libxml2-dev libexpat1-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgles2-mesa-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libpixman-1-dev libxcb1-dev libxcb-dri3-dev \
            libxcb-present-dev libxcb-xfixes0-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xkb-dev libxcb-composite0-dev \
            libxcb-damage0-dev libxcb-glx0-dev libxcb-sync-dev libxcb-util0-dev \
            libxcb-icccm4-dev libxcb-ewmh-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-xinerama0-dev libxcb-xinput-dev \
            libxcb-xv0-dev libxcb-xtest0-dev libxcb-randr0-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev \
            libxrandr-dev libxrender-dev libxkbcommon-x11-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"

      - name: Build integrated WLDroid compositor, PRoot, VirGL, and APK
        run: bash scripts/build-wldroid-apk.sh

      - name: Verify final APK payload and package identity
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/alpine-rootfs-aarch64.tar.xz$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^lib/arm64-v8a/libwldroid-compositor.so$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^lib/arm64-v8a/libproot.so$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^lib/arm64-v8a/libproot-loader.so$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^lib/arm64-v8a/libvirgl-test-server.so$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/drm-shim/libdrm-shim.so$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/netstub/libnetstub.so$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/ALPINE-LICENSES.txt$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/alpine-rootfs-aarch64.tar.xz.sha256$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/WLDROID-LICENSE.txt$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/WLDROID-SOURCE-NOTICE.txt$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/THIRD-PARTY-LICENSE-INDEX.txt$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/licenses/PRoot-' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/licenses/wlroots-' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/licenses/virglrenderer-' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/licenses/talloc-' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/licenses/libepoxy-' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/licenses/wayland-' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/gbm-shim/libgbm.so$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/egl-override/libegl_override.so$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/drm-shim/libdrm-wrapper.so$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/xkb/symbols/us$' "$RUNNER_TEMP/apk-contents.txt"
          grep -q '^assets/xkb/rules/evdev$' "$RUNNER_TEMP/apk-contents.txt"
          EXPECTED_SHA=$(awk '{print $1}' .work/alpine-assets/alpine-rootfs-aarch64.tar.xz.sha256)
          ACTUAL_SHA=$(unzip -p "$APK" assets/alpine-rootfs-aarch64.tar.xz | sha256sum | awk '{print $1}')
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='org.alpinekde.mobile'" "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload single-APK Alpine KDE build
        uses: actions/upload-artifact@v4
        with:
          name: alpine-kde-mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
