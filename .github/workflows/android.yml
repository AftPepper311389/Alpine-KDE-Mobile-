name: Linuxhub 1.2.0 Alpine KDE APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpine-kde-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-rootfs:
    name: Build Alpine ARM64 rootfs natively (no emulation)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout migration overlay
        uses: actions/checkout@v4

      - name: Verify native ARM64 runner
        run: |
          test "$(uname -m)" = "aarch64"
          docker version
          docker run --rm alpine:3.21 uname -m

      - name: Build Alpine 3.21 ARM64 + KDE Plasma X11 rootfs
        run: |
          mkdir -p .work
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            alpine:3.21 sh scripts/build-alpine-rootfs.sh
          sudo tar --format=ustar --numeric-owner -I 'gzip -1' -cf .work/alpine-rootfs-aarch64.tar.gz \
            -C .work/alpine-rootfs .
          sha256sum .work/alpine-rootfs-aarch64.tar.gz
          sudo du -sh .work/alpine-rootfs .work/alpine-rootfs-aarch64.tar.gz

      - name: Upload native ARM64 rootfs
        uses: actions/upload-artifact@v4
        with:
          name: alpine-rootfs-aarch64
          path: .work/alpine-rootfs-aarch64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-apk:
    name: Build Linuxhub 1.2.0 APK and verify embedded Alpine ARM64
    runs-on: ubuntu-24.04
    needs: build-rootfs
    timeout-minutes: 180
    steps:
      - name: Checkout migration overlay
        uses: actions/checkout@v4

      - name: Download native ARM64 rootfs
        uses: actions/download-artifact@v4
        with:
          name: alpine-rootfs-aarch64
          path: .work

      - name: Verify rootfs artifact
        run: |
          test -s .work/alpine-rootfs-aarch64.tar.gz
          sha256sum .work/alpine-rootfs-aarch64.tar.gz

      - name: Fetch official Linuxhub 1.2.0 source
        run: |
          git clone --depth 1 --branch 1.2.0 --recurse-submodules \
            https://github.com/xishanp/Linuxhub.git linuxhub-1.2.0
          test -f linuxhub-1.2.0/gradlew
          test -f linuxhub-1.2.0/app/src/main/java/com/doro/terminal/shell/linux/LinuxContainerManager.kt

      - name: Replace Ubuntu runtime with embedded Alpine KDE
        run: |
          bash scripts/prepare-linuxhub-alpine.sh \
            "$GITHUB_WORKSPACE/linuxhub-1.2.0" \
            "$GITHUB_WORKSPACE/.work/alpine-rootfs-aarch64.tar.gz"
          grep -q 'alpine-rootfs-aarch64.tar.gz' \
            linuxhub-1.2.0/app/src/main/java/com/doro/terminal/shell/linux/LinuxContainerManager.kt
          grep -q 'startplasma-x11' \
            linuxhub-1.2.0/app/src/main/java/com/doro/terminal/shell/linux/DesktopCompatibility.kt
          test -s linuxhub-1.2.0/app/src/main/assets/rootfs/alpine-rootfs-aarch64.tar.gz

      - name: Audit generated source and native build configuration
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          script = Path("scripts/prepare-linuxhub-alpine.sh").read_text()
          marker = script.index("<<'PY'")
          start = script.index(chr(10), marker) + 1
          end = script.index(chr(10) + "PY" + chr(10), start)
          compile(script[start:end], "prepare-linuxhub-alpine.py", "exec")
          print("Migration generator syntax: OK")
          PY
          LORIE=linuxhub-1.2.0/termux_ubuntu_rebuild/termux_x11_source/lorie/src/main/cpp
          test -s "$LORIE/xorgproto/include/X11/Xfuncproto.h"
          grep -q '#define _X_HIDDEN' "$LORIE/xorgproto/include/X11/Xfuncproto.h"
          grep -q 'execute_process(' "$LORIE/recipes/xkbcomp.cmake"
          grep -Fq '"${CMAKE_CURRENT_BINARY_DIR}"' "$LORIE/recipes/xorgproto.cmake"
          ! grep -q '"&&"' "$LORIE/recipes/xkbcomp.cmake"
          grep -q 'target_compile_options(Xau PRIVATE' "$LORIE/recipes/Xau.cmake"
          ! grep -q 'linux-aarch64' linuxhub-1.2.0/app/build.gradle.kts
          grep -q 'noCompress += listOf("tar", "gz")' linuxhub-1.2.0/app/build.gradle.kts
          grep -q 'startplasma-x11' linuxhub-1.2.0/app/src/main/java/com/doro/terminal/shell/linux/DesktopCompatibility.kt
          echo "Generated Kotlin/CMake/Gradle migration audit: OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"
          yes | sdkmanager --licenses || true

      - name: Build single APK
        working-directory: linuxhub-1.2.0
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-diagnostic
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK contains Alpine rootfs and ARM64 runtime
        working-directory: linuxhub-1.2.0
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-files.txt"
          echo "APK entry diagnostics:"
          grep -E '(^assets/|^lib/arm64-v8a/|alpine-rootfs|libproot|libXlorie)' "$RUNNER_TEMP/apk-files.txt" | head -200 || true
          for entry in \
            assets/rootfs/alpine-rootfs-aarch64.tar.gz \
            lib/arm64-v8a/libproot.so \
            lib/arm64-v8a/libproot-loader.so \
            lib/arm64-v8a/libXlorie.so \
            assets/rootfs/alpine-rootfs-aarch64.tar.gz.sha256; do
            if ! grep -Fxq "$entry" "$RUNNER_TEMP/apk-files.txt"; then
              echo "::error::Missing APK entry: $entry"
              exit 1
            fi
          done
          EXPECTED=$(cat app/src/main/assets/rootfs/alpine-rootfs-aarch64.tar.gz.sha256)
          ACTUAL=$(unzip -p "$APK" assets/rootfs/alpine-rootfs-aarch64.tar.gz | sha256sum | awk '{print $1}')
          echo "Expected rootfs SHA256: $EXPECTED"
          echo "Actual rootfs SHA256:   $ACTUAL"
          test "$EXPECTED" = "$ACTUAL"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK diagnostic even when verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Linuxhub-1.2.0-Alpine-KDE-APK-diagnostic
          path: linuxhub-1.2.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Linuxhub-1.2.0-Alpine-KDE-ARM64
          path: linuxhub-1.2.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
