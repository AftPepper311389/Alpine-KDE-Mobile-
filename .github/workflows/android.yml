name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build embedded Alpine KDE Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 rootfs build
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Alpine ARM64 + KDE Plasma root filesystem
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            alpine:3.24.4 sh scripts/build-alpine-rootfs.sh

      - name: Verify embedded KDE rootfs archive
        run: |
          test -s app/src/main/assets/alpine-rootfs-aarch64.tar.gz
          sha256sum -c app/src/main/assets/alpine-rootfs-aarch64.tar.gz.sha256
          grep -q '^KDE_DESKTOP=installed$' app/src/main/assets/rootfs-build-info.txt
          grep -q '^P:plasma-desktop$' app/src/main/assets/alpine-kde-package-check.txt
          grep -q '^P:plasma-workspace$' app/src/main/assets/alpine-kde-package-check.txt
          grep -q '^P:kwin$' app/src/main/assets/alpine-kde-package-check.txt
          tar -tzf app/src/main/assets/alpine-rootfs-aarch64.tar.gz | grep -q './usr/bin/startplasma-wayland'
          test -s app/src/main/assets/ALPINE-LICENSES.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Build Android PRoot runtime for arm64-v8a
        run: bash scripts/build-proot-android.sh

      - name: Verify Android PRoot runtime
        run: |
          test -x app/src/main/jniLibs/arm64-v8a/libproot.so
          test -s app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          readelf -h app/src/main/jniLibs/arm64-v8a/libproot.so | grep -q 'AArch64'
          test -s app/src/main/assets/PROOT-COPYING.txt
          test -s app/src/main/jniLibs/arm64-v8a/SHA256SUMS

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK contains Alpine KDE and PRoot
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep 'assets/alpine-rootfs-aarch64.tar.gz'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libproot.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libproot-loader.so'
          unzip -l "$APK" | grep 'assets/ALPINE-LICENSES.txt'
          unzip -l "$APK" | grep 'assets/PROOT-COPYING.txt'
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: alpine-kde-mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
